<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Delete TODO</title>
</head>
<body style="font-family:system-ui; max-width:700px; margin:40px auto;">
  <h1>Delete TODO</h1>

  <p>Are you sure you want to delete: <strong>{{ todo.title }}</strong>?</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit">Yes, delete</button>
    <a href="{% url 'todo_list' %}">Cancel</a>
  </form>
</body>
</html>
